# Local development / single-server deployment.
#   cp .env.example .env      (then edit .env)
#   docker compose up --build
# Dashboard: http://localhost:8080   API docs: http://localhost:8000/docs

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-insta}:${POSTGRES_PASSWORD:-insta}@db:5432/${POSTGRES_DB:-insta}
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /app/media
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insta}
      POSTGRES_DB: ${POSTGRES_DB:-insta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insta} -d ${POSTGRES_DB:-insta}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # FastAPI backend (runs database migrations on start)
  api:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Background jobs: publishing, content generation, token refresh, Sheets sync
  worker:
    <<: *backend
    command: celery -A app.scheduler.celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      api:
        condition: service_healthy

  # Periodic task trigger. Run exactly ONE beat instance.
  beat:
    <<: *backend
    command: celery -A app.scheduler.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      api:
        condition: service_healthy

  # React dashboard served by nginx, proxying /api and /media to the backend
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional workflow automation (n8n). Start with:  docker compose --profile n8n up -d
  # Editor: http://localhost:5678   Guide: docs/N8N.md
  n8n:
    image: n8nio/n8n:2.41.6
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      TZ: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_LISTEN_ADDRESS: 0.0.0.0        # IPv4; many Docker hosts have no IPv6
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # The example workflows verify webhook signatures in a Code node:
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      IA_WEBHOOK_SECRET: ${IA_WEBHOOK_SECRET:-}
      IA_API_URL: http://api:8000/api
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
  n8n_data:
